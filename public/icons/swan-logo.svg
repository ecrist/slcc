  <path d="M178 66 C182 62, 188 56, 190 48 C192 42, 190 38, 186 40 C182 42, 180 48, 180 56"
        stroke="black" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M186 40 C190 36, 196 32, 198 26"
        stroke="black" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Wing detail -->
  <path d="M80 52 C90 48, 100 50, 110 56 C120 62, 128 66, 136 66"
