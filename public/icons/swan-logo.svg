  <!-- Upper body line -->
  <path d="M62 46 C70 42, 80 40, 92 42 C104 44, 120 50, 140 58 C155 64, 168 68, 178 66 C186 64, 192 58, 194 50"
        stroke="black" stroke-width="3" stroke-linecap="round" fill="none"/>
