  <path d="M58 42 C54 48, 52 56, 54 64 C56 72, 62 80, 72 86 C82 92, 96 96, 112 96 C128 96, 144 92, 156 84 C168 76, 176 66, 180 56"
        stroke="black" stroke-width="3" stroke-linecap="round" fill="none"/>
