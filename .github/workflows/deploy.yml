name: Deploy

on:
  push:
    branches: [main, boxfort, gorilla]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch / environment to deploy (main, boxfort, gorilla)"
        required: false
        default: ""

# Resolve the effective branch: manual input overrides ref_name
env:
  EFFECTIVE_BRANCH: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}

jobs:
  # ── Type-check ───────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Unit + integration tests ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swanlake_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swanlake_test
        run: npm test

  # ── Deploy: production (main) ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: (inputs.branch != '' && inputs.branch || github.ref_name) == 'main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/swan-lake

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Installing dependencies"
            npm ci --legacy-peer-deps

            echo "==> Building"
            npm run build

            echo "==> Running migrations"
            npm run db:migrate

            echo "==> Reloading PM2 (zero-downtime)"
            pm2 reload swan-lake --update-env

            echo ""
            echo "✓ Production deployed → https://slcc.secure-computing.net"
            pm2 status

  # ── Deploy: branch environments (boxfort / gorilla) ──────────────────────────
  deploy-branch:
    name: Deploy ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: >-
      (inputs.branch != '' && inputs.branch || github.ref_name) == 'boxfort' ||
      (inputs.branch != '' && inputs.branch || github.ref_name) == 'gorilla'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            BRANCH="${{ inputs.branch != '' && inputs.branch || github.ref_name }}"
            APP_DIR="/var/www/${BRANCH}"
            PORT=$( [ "$BRANCH" = "boxfort" ] && echo 3001 || echo 3002 )

            echo "==> Deploying ${BRANCH} → ${APP_DIR} (port ${PORT})"
            cd "$APP_DIR"

            echo "==> Pulling latest code"
            git pull origin "$BRANCH"

            echo "==> Installing dependencies"
            npm ci --legacy-peer-deps

            echo "==> Building"
            npm run build

            echo "==> Running migrations"
            npm run db:migrate

            echo "==> Reloading PM2 (zero-downtime)"
            pm2 reload "$BRANCH" --update-env -- start --port "$PORT"

            echo ""
            echo "✓ ${BRANCH} deployed → https://${BRANCH}.secure-computing.net"
            pm2 status
