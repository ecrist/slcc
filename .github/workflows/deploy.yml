name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # ── Type-check on GitHub runner (fast feedback before touching the server) ──
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Deploy to Vultr VM ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: typecheck          # only deploy if type check passes
    environment: production   # requires environment approval if configured

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP_DIR="/var/www/swan-lake"
            cd "$APP_DIR"

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Installing dependencies"
            npm ci --legacy-peer-deps

            echo "==> Building"
            npm run build

            echo "==> Running migrations"
            npm run db:migrate

            echo "==> Reloading PM2 (zero-downtime)"
            pm2 reload swan-lake --update-env

            echo "==> Done"
            pm2 status
