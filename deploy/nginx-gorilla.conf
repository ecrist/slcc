# gorilla dev environment — nginx vhost
# Copy to /etc/nginx/sites-available/gorilla after certbot issues SSL

server {
    listen 80;
    listen [::]:80;
    server_name gorilla.secure-computing.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gorilla.secure-computing.net;

    ssl_certificate     /etc/letsencrypt/live/gorilla.secure-computing.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gorilla.secure-computing.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        alias /var/www/gorilla/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /sw.js {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
