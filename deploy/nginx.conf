# Swan Lake CC — nginx site config
# Place at: /etc/nginx/sites-available/swan-lake
# Symlink: ln -s /etc/nginx/sites-available/swan-lake /etc/nginx/sites-enabled/

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name slcc.secure-computing.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name slcc.secure-computing.net;

    # SSL — managed by Certbot (will be auto-populated on first run)
    ssl_certificate     /etc/letsencrypt/live/slcc.secure-computing.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slcc.secure-computing.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase body size for any file uploads (Square webhook payloads, etc.)
    client_max_body_size 10M;

    # Proxy to Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Serve Next.js static assets directly (bypasses Node.js for speed)
    location /_next/static/ {
        alias /var/www/swan-lake/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service worker — must not be cached by the browser
    location /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
